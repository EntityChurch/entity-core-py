[project]
name = "entity-core"
version = "0.8.0"
description = "Python implementation of the Entity Core Protocol V7"
# No `readme` field. It pointed at `../../README.md`, and current hatchling
# rejects a readme outside the project directory outright — which broke the
# canonical `make test` container build (`uv sync` fails before a single test
# runs) while the host venv, already installed, kept passing. The two sibling
# packages never had the field. Copying the repo README in would give the same
# fact two homes; the repo root keeps it.
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "base58>=2.1.1",
    "cbor2>=5.8.0",
    "cryptography>=41.0.0",
    "pynacl>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_core"]
