[project]
name = "entity-sdk"
version = "0.9.0"
description = "L1 operations SDK for the Entity Core Protocol (SDK-OPERATIONS v0.8)"
requires-python = ">=3.11"
# Tier 2. Depends on the kernel only — NOT on entity-handlers. The SDK reaches
# handlers by dispatching to their pattern strings, never by importing them, so
# the tier boundary in tests/unit/test_package_layering.py holds by construction
# rather than by discipline.
dependencies = [
    "entity-core>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_sdk"]
