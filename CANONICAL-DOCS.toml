# ── What each directory IS ────────────────────────────────────────────────────
# Declared so the doc checks are not guessing. Longest path wins.

[[area]]
path      = "docs/status"
kind      = "status"       # dated, episodic, ages out to docs/archive/status
publishes = false

[[area]]
path      = "docs/archive"
kind      = "archive"      # dated BY DESIGN; does not age out
publishes = false

[[area]]
path      = "docs/outbox"
kind      = "outbox"       # routing packets we have SENT — never published
publishes = false

[[area]]
path      = "docs/archive/outbox"
kind      = "outbox"       # acknowledged packets — never published
publishes = false

[[area]]
path      = "docs/agents/memory"
kind      = "memory"       # durable, indexed, edited in place
publishes = true

# Dated by design and NOT episodic: a review is a durable design record, written
# once and kept because the decision it argues is still load-bearing. The date in
# the filename is provenance, not a staleness clock — so the dated-doc rule, which
# is written for HANDOFF/STATUS/CHECKPOINT, is wrong about this directory. These
# publish: the SDK/application tier split is a reader-facing architecture decision
# and AGENTS.md cites it.
[[area]]
path      = "docs/architecture/reviews"
kind      = "archive"
publishes = true

# ── Living documents ──────────────────────────────────────────────────────────
# Durable and rewritten in place, so they are NOT dated snapshots and must not be
# aged out. The trackers additionally must never publish: they name counterparts,
# unacknowledged packets and internal obligations. `internal = true` is the only
# honest answer for them — declaring them canonical would ship them.

[[living]]
glob     = "docs/status/TRACKER-*.md"
internal = true

[[living]]
path = "docs/STATUS.md"
