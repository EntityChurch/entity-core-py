[project]
name   = "Entity Core (Python)"
slug   = "entity-core-py"
repo   = "entity-core-py"
github = "https://github.com/EntityChurch/entity-core-py"
intro  = """
entity-core-py is a reference implementation of the Entity Core Protocol (v7),
written in Python. It sits in the stack as one of three independent
language reference impls (alongside the Go oracle and the Rust impl): it
implements the wire protocol — content-addressed entities, ECF/CBOR encoding,
Ed25519/Ed448 identity, capability delegation, and the handler/peer runtime —
directly from the specification, and exists primarily to validate that the spec
is clear and complete enough to build interoperable peers. It depends on the
protocol specification (entity-core-architecture); nothing else in the batch
depends on it (the three cores do not cross-depend). Confidence: solid and
cross-impl-converged (4000+ tests, validate-peer green), at the v0.8 research-
preview maturity level — not a 1.0 API commitment.
"""

[[doc]]
path  = "README.md"
title = "Overview"
blurb = "What the project is, how to build/test it, and a tour of the CLI and protocol."
group = "Overview"

[[doc]]
path  = "docs/CLI.md"
title = "Command-line tools"
blurb = "The make targets and the entity-core CLI — what each does, how to invoke it, key flags."
group = "Tools"

[[doc]]
path  = "docs/VALIDATING.md"
title = "Validating a peer against the spec"
blurb = "The cross-implementation peer validator: what it checks and how to run it."
group = "Tools"

[[doc]]
path  = "docs/HANDLER-ARCHITECTURE.md"
title = "Handler architecture"
blurb = "How handlers, the registry, and dispatch fit together in the Python peer."
group = "Architecture"

# ── The interop record ────────────────────────────────────────────────────────
# These two ARE this repo's product. Its stated purpose is validating that the
# specification is clear and complete enough to build a compatible peer from the
# text alone; SPEC-AMBIGUITIES is the answer, 67 entries deep, and
# CONFORMANCE-EXCLUSIONS is the honesty half — what we satisfy in-process rather
# than at the wire, so no reader mistakes a green category for a green row.
# Both were undeclared, which at the next cut would have deleted them.

[[doc]]
path  = "docs/SPEC-AMBIGUITIES.md"
title = "Spec ambiguities found while implementing"
blurb = "Every gap and contradiction this clean-room peer hit in the spec, what we did meanwhile, and how upstream ruled."
group = "Architecture"

[[doc]]
path  = "docs/CONFORMANCE-EXCLUSIONS.md"
title = "Declared conformance exclusions"
blurb = "Vectors satisfied in-process rather than at the wire, each with the reason and the mutation it was verified against."
group = "Architecture"

[[doc]]
path  = "docs/architecture/reviews/REVIEW-THE-SDK-AND-APPLICATION-TIER-GAP-2026-08-17.md"
title = "Review — the SDK and application tier gap"
blurb = "Why this repo carries the SDK and application tiers in-tree, and the five-package target shape."
group = "Architecture"

# ── Status ────────────────────────────────────────────────────────────────────
# The rolling canonical log, moved out of `docs/status/` to `docs/STATUS.md`.
# [ADR-0031] rules that the DATED snapshots under `docs/status/`
# (HANDOFF-*/CHECKPOINT-*/REVIEW-*/ROUTING-*) publish nothing, while the single
# rolling status log does — it is how a repo says publicly what it is working on.
# Separating them by PATH rather than by remembering a filename is the point of
# the move: `docs/status/` is now uniformly internal. The removal of the old path
# is declared in `.release-removals`.

[[doc]]
